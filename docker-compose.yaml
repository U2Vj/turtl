# This docker-compose file can be used (run docker-compose up -d)
# to create a docker network (network1) with an isolated kali-container inside.
# This can be used to simulate a docker-service during development.
# The ID and status of the container can be found with the command: docker ps -a
services:
  kali-container:
    build:
      context: ./demo-virtualizations/kali-linux
      dockerfile: ./Dockerfile
    networks:
      task_network:
        ipv4_address: 192.168.254.2
      default:
  ubuntu-server:
    build:
      context: ./demo-virtualizations/ubuntu-nginx
      dockerfile: ./Dockerfile
    networks:
      task_network:
        ipv4_address: 192.168.254.3
      default:
  redis:
    image: 'redis:latest'
  
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - default
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/srv/turtl/static:ro
      - ./media:/srv/turtl/media:ro
      - ./frontend/dist:/srv/turtl/web:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  task_network:
    internal: true
    ipam:
      driver: default
      config:
        - subnet: 192.168.254.0/24