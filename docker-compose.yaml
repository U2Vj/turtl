services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres_database:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - backend
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      PROXMOX_CA_PATH: /app/proxmox-ca.pem
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - ./proxmox-ca.pem:/app/proxmox-ca.pem:ro
    networks:
      - frontend
      - backend
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  cleanup:
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      PROXMOX_CA_PATH: /app/proxmox-ca.pem
    volumes:
      - ./proxmox-ca.pem:/app/proxmox-ca.pem:ro
    networks:
      - frontend
      - backend
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    entrypoint: []
    command: >
      sh -c 'while true; do
        python manage.py cleanup_lab_envs || true;
        python manage.py flushexpiredtokens || true;
        sleep 600;
      done'

  nginx:
    build:
      context: .
      dockerfile: ./deploy/frontend.Dockerfile
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME must be set}
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - static_data:/srv/turtl/static:ro
      - media_data:/srv/turtl/media:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    networks:
      - frontend
    depends_on:
      - app
    restart: unless-stopped
  
  grafana:
    image: grafana/grafana-oss:13.0.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${GRAFANA_DB_USER:?GRAFANA_DB_USER must be set}
      POSTGRES_PASSWORD: ${GRAFANA_DB_PASSWORD:?GRAFANA_DB_PASSWORD must be set}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana-provisioning:/etc/grafana/provisioning:ro
    networks:
      - backend
      - frontend
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_database:
  static_data:
  media_data:
  grafana_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
