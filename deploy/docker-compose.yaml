services:
  ofelia:
    image: mcuadros/ofelia:latest
    depends_on:
      - backend
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_db:/var/lib/postgresql
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    networks:
      - backend
    restart: unless-stopped
    
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/frontend.Dockerfile
    ports:
      - "443:8080"
    secrets:
      - turtl.crt
      - turtl.key
    networks:
      - frontend
    volumes:
      - static_data:/usr/share/nginx/html/static:ro
      
  backend:
    build:
      context: ..
      dockerfile: deploy/backend/backend.Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    networks:
      - backend
      - frontend
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      - postgres
      - redis
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.cleanupenv.schedule: "@every 30s"
      ofelia.job-exec.cleanupenv.command: "python manage.py cleanup_lab_envs"
      ofelia.job-exec.flushtokens.schedule: "@every 30s"
      ofelia.job-exec.flushtokens.command: "python manage.py flushexpiredtokens"
    post_start:
      - command: python manage.py migrate
      - command: python manage.py collectstatic --noinput
    restart: unless-stopped

secrets:
  turtl.crt:
    file: ./certs/turtl.crt
  turtl.key:
    file: ./certs/turtl.key

volumes:
  postgres_db:
  static_data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
