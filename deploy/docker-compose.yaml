services:
  ofelia:
    image: mcuadros/ofelia:latest
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_db:/var/lib/postgresql
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - backend
    restart: unless-stopped
    
  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend/frontend.Dockerfile
    ports:
      - "443:8080"
    secrets:
      - turtl.crt
      - turtl.key
    networks:
      - frontend
    volumes:
      - static_data:/usr/share/nginx/html/static:ro
    depends_on:
      backend:
        condition: service_healthy
        restart: true
      
  backend:
    build:
      context: ..
      dockerfile: deploy/backend/backend.Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    secrets:
      - proxmox-ca.pem
    networks:
      - backend
      - frontend
    volumes:
      - static_data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.cleanupenv.schedule: "@every 5m"
      ofelia.job-exec.cleanupenv.command: "python manage.py cleanup_lab_envs"
      ofelia.job-exec.flushtokens.schedule: "@every 30m"
      ofelia.job-exec.flushtokens.command: "python manage.py flushexpiredtokens"
    post_start:
      - command: python manage.py migrate
      - command: python manage.py collectstatic --noinput
    restart: unless-stopped
  
  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    environment:
      GRAFANA_DB_USER: ${GRAFANA_DB_USER}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    networks:
      - frontend
      - backend
    volumes:
      - ./grafana-provisioning:/etc/grafana/provisioning

secrets:
  turtl.crt:
    file: ./certs/turtl.crt
  turtl.key:
    file: ./certs/turtl.key
  proxmox-ca.pem:
    file: ./certs/proxmox-ca.pem

volumes:
  postgres_db:
  static_data:

networks:
  backend:
    internal: true
  frontend:
    driver: bridge
