# nginx config

server {
    listen 80;
    server_name turtl.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name turtl.example.com;

    ssl_certificate     /etc/letsencrypt/live/turtl.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/turtl.example.com/privkey.pem;

    client_max_body_size 20M;

    location /static/ { alias /var/www/turtl/app/staticfiles/; }
    location /media/  { alias /var/www/turtl/app/media/; }

    location ~ ^/(admin|users|catalog|enrollments|vm|shell)/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s; 
    }

    location / {
        root /var/www/turtl/frontend;
        try_files $uri /index.html;
    }
}
